<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Tilt</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="row pills">
    <span id="link" class="pill">offline</span>
    <span id="armed" class="pill">disarmed</span>
    <span id="beat" class="pill warn">no data</span>
    <span id="stale" class="pill warn" hidden>no input</span>
    <span id="board" class="pill warn" hidden>board lost</span>
    <span id="hand" class="pill">hand: none</span>
    <span id="ballpill" class="pill warn">ball: lost</span>
  </div>
  <div class="stage">
    <div class="arena">
      <canvas id="race"></canvas>
      <span id="timer" class="hud">00:00.00</span>
      <span id="delta" class="hud"></span>
      <span id="count" class="hud"></span>
      <span id="pen" class="hud"></span>
      <div id="result" class="hud"><b></b><span></span></div>
      <span id="cps" class="hud">0/4</span>
      <span id="speed" class="hud">0</span>
      <span id="banner" class="hud">arm to race</span>
      <span id="level" class="hud" hidden>levelling</span>
      <canvas id="pad"></canvas>
    </div>
    <div id="side"></div>
    <canvas id="strip"></canvas>
  </div>
  <div class="row">
    <button id="arm">arm</button>
    <span id="armblock" hidden></span>
    <button id="kill">kill (space)</button>
    <button id="racebtn">race (r)</button>
  </div>
  <div class="row dim"><span id="tilt">tilt x 0.00°  y 0.00°</span><span>arrows / wasd to tilt</span><span>c re-centres the hand neutral</span></div>
</main>
<div class="view">
  <img id="cam" alt="overhead cam">
  <div id="seen" class="ring" hidden></div>
  <span id="nocam" hidden>no camera</span>
</div>
<script src="/static/race.js"></script>
<script src="/static/pad.js"></script>
<script src="/static/strip.js"></script>
<script src="/static/hud.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
