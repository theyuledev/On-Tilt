name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # github downloads 504 sometimes, fall back to uv from pypi
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
      - if: steps.uv.outcome == 'failure'
        run: |
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      # python 3.12 is also a github download on this image
      - run: uv sync --locked || (sleep 20 && uv sync --locked)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest -m "not hardware"

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [unor4wifi, minima]
    steps:
      - uses: actions/checkout@v4
      # github downloads 504 sometimes, retry once after a pause
      - uses: arduino/setup-arduino-cli@v2
        id: cli
        continue-on-error: true
      - if: steps.cli.outcome == 'failure'
        run: sleep 30
      - if: steps.cli.outcome == 'failure'
        uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index && arduino-cli core install arduino:renesas_uno@1.6.0
      - run: arduino-cli lib install Servo@1.3.0
      - run: arduino-cli compile --fqbn arduino:renesas_uno:${{ matrix.board }} firmware/tilt
